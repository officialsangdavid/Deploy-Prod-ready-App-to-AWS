name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/deploy-prod-ready-application

jobs:
  #Job 1: The Test job runs on every push and PR to main, and must pass before the Build & Push job can run
  test:
    name: Test Job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/htmlcov/

#Job 2: The Security Scan job runs on every push and PR to main, and must pass before the Build & Push job can run
  security:
    name: Security Scan with Snyk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Set up Node.js
        uses: actions/setup-node@master
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        with:
           command: test --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Gitleaks
        uses: gacts/gitleaks@v1
        with:
          config-path: .gitleaks.toml
          fail-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload report
        if: always()
        run: |
          echo '{}' > gitleaks-report.json
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
#Job 3: SAST Scan with Trivy, runs on every push and PR to main, and must pass before the Build & Push job can run
  image-scan:
    name: Image Scan with Trivy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Trivy
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          version: '0.34.0'
      - name: Run Trivy SAST scan
        run: |
          trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .


  # Job 4: Build & Push to Docker Hub
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  #Job 4: Deploy to EC2 via SSH
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/deploy-prod-ready-application

            # Pull the latest image from Docker Hub
            docker compose pull app

            # Restart only the app container — leaves monitoring stack untouched
            docker compose up -d --no-deps app

            # Wait for container to be ready then verify
            sleep 10
            docker compose ps app
            curl -sf http://localhost:3000/health \
              && echo "✓ Health check passed" \
              || (echo "✗ Health check FAILED" && exit 1)